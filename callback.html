<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تم الربط بنجاح</title><style>body{font-family:system-ui;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{background:#111;border:1px solid #333;padding:40px;border-radius:24px;text-align:center;max-width:500px}</style></head><body><div class="card"><div style="font-size:64px">✅</div><h1>تم الربط بنجاح!</h1><p id="msg">جاري المعالجة...</p><code id="code" style="background:#222;padding:12px;display:block;border-radius:8px;word-break:break-all;margin:15px 0;direction:ltr"></code></div><script>const p=new URLSearchParams(location.search);const c=p.get('code');if(c){document.getElementById('code').textContent=c;document.getElementById('msg').textContent='انسخ هذا الكود';}else{document.getElementById('msg').textContent='لا يوجد كود - تم الربط سابقاً';}</script></body></html>
